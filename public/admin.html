<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaVi Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <header class="admin-top">
    <strong>SaVi Tech · Admin</strong>
    <span>
      <a href="index.html">View site</a>
      <button class="mini" id="logout" type="button" style="margin-left:12px">Sign out</button>
    </span>
  </header>

  <div class="admin-shell">
    <section class="login-card" id="login-card">
      <p class="eyebrow" style="color:#0b7a9a">Restricted</p>
      <h1 style="font-size:1.8rem;margin:0 0 8px">Sign in</h1>
      <p style="color:#4d5d72;margin-top:0">Manage pages, services, team, and messages. This dashboard lives in this browser.</p>
      <form id="login-form">
        <label class="field">Password
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-cyan" type="submit">Enter dashboard</button>
        <p class="form-note error" id="login-note"></p>
      </form>
      <p style="color:#6b7c90;font-size:0.85rem">Default password is set on first visit. Change it under Settings after you sign in.</p>
    </section>

    <section id="dash" class="hidden">
      <div class="admin-grid">
        <nav class="side-nav" aria-label="Admin sections">
          <button type="button" data-panel="copy" class="active">Site copy</button>
          <button type="button" data-panel="services">Services</button>
          <button type="button" data-panel="steps">Process</button>
          <button type="button" data-panel="team">Team</button>
          <button type="button" data-panel="inquiries">Messages</button>
          <button type="button" data-panel="settings">Settings</button>
        </nav>
        <div>
          <div class="panel" id="panel-copy"></div>
          <div class="panel hidden" id="panel-services"></div>
          <div class="panel hidden" id="panel-steps"></div>
          <div class="panel hidden" id="panel-team"></div>
          <div class="panel hidden" id="panel-inquiries"></div>
          <div class="panel hidden" id="panel-settings"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
