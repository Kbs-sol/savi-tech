<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- First commit cyan & ink gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EE0FF"/>
      <stop offset="100%" stop-color="#14C4E6"/>
    </linearGradient>

    <!-- Subtle container glow -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base: Midnight Navy #0B1B33 with stroke line rgba(244, 247, 251, 0.12) -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#0B1B33" stroke="rgba(62, 224, 255, 0.3)" stroke-width="2.5"/>
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="rgba(244, 247, 251, 0.06)" stroke-width="1.5"/>

  <!-- Precision "SaVi" Architectural Typography Layout -->
  <g transform="translate(48, 116)">
    <!-- 'Sa' : Human-centered Design (Paper #F4F7FB) -->
    <text x="32" y="196" font-family="'Outfit', -apple-system, sans-serif" font-size="168" font-weight="700" letter-spacing="-6" fill="#F4F7FB">Sa</text>

    <!-- 'Vi' : Engineering Precision (Electric Cyan #3EE0FF with subtle glow) -->
    <text x="216" y="196" font-family="'Outfit', -apple-system, sans-serif" font-size="168" font-weight="700" letter-spacing="-6" fill="url(#cyanGrad)">Vi</text>

    <!-- Precision Horizontal Baseline Accent in Electric Cyan -->
    <rect x="34" y="222" width="348" height="8" rx="4" fill="url(#cyanGrad)"/>
    
    <!-- Micro-accent: Warm coral dot (First commit secondary: #FF8A3D) -->
    <circle cx="372" cy="226" r="4" fill="#FF8A3D"/>
  </g>
</svg>
