<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Interactive Brand Logo Lockup: SaVi Wordmark + The 3 Pillars Pulse Bar + Tagline -->
  <g id="brand-mark">
    <!-- Sa (Design & Creative Foundation) -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5" fill="#111111">Sa</text>
    
    <!-- Vi (Engineering & Systems Vertex) with Warm Amber Dot -->
    <text x="48" y="38" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5" fill="#111111">Vi</text>
    <circle cx="82" cy="18" r="4" fill="#E8590C"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="98" y1="12" x2="98" y2="44" stroke="#E6E4DF" stroke-width="1.5"/>

  <!-- Tagline Pillars: DESIGN . DEVELOP . DELIVER -->
  <g transform="translate(112, 16)">
    <text x="0" y="12" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="2" fill="#E8590C">DESIGN. DEVELOP. DELIVER.</text>
    <text x="0" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" color="#7E7E7E" fill="#7E7E7E">Simple · Effective · Efficient</text>
  </g>
</svg>
