<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Cyan to Deep Cobalt Electric Glow -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EE0FF"/>
      <stop offset="60%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>

    <!-- Platinum Gradient for S -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="cardBg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0D1D35"/>
      <stop offset="50%" stop-color="#071120"/>
      <stop offset="100%" stop-color="#03070E"/>
    </radialGradient>
  </defs>

  <!-- Outer Atmosphere Aura -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="rgba(62, 224, 255, 0.14)" filter="url(#ambientGlow)"/>

  <!-- Premium Obsidian Chamfered Squircle Base -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="url(#cardBg)" stroke="rgba(62, 224, 255, 0.3)" stroke-width="2.5"/>
  <rect x="48" y="48" width="416" height="416" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>

  <!-- SV Monogram Geometric Interlock System -->
  <g transform="translate(4, 0)">
    <!-- 'S' Upper Arch & Fluid Spine (Sahera: Human Design & Creative Flow) -->
    <path d="M 248 144 C 200 134 140 148 132 196 C 124 246 168 266 216 280 C 274 298 304 322 296 364 C 286 414 212 426 156 404 C 136 396 122 384 114 372" 
          stroke="url(#sGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'V' Precision Engineering Apex (Vijay: Precision & Code Architecture) -->
    <!-- The left stem weaves dynamically behind the S waist, right arm cuts sharp into the future -->
    <path d="M 282 152 L 356 368 L 424 152" 
          stroke="url(#vGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Overlapping Intersection Knot / Electric Spark -->
    <circle cx="356" cy="368" r="7" fill="#3EE0FF" filter="drop-shadow(0 0 10px #3EE0FF)"/>
    <circle cx="216" cy="280" r="6" fill="#FFFFFF"/>
    
    <!-- Micro-accent: Code & Design Precision Crosshair -->
    <circle cx="132" cy="196" r="5" fill="#3EE0FF"/>
  </g>
</svg>
