<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="saviGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EE0FF"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="saviGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EE0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#saviGlow)" filter="url(#glowFilter)"/>

  <!-- Icon Container Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#080F1D" stroke="rgba(62, 224, 255, 0.28)" stroke-width="3"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5"/>

  <!-- S Glyph (Fluid Dynamic Ribbon) -->
  <path d="M 238 142 C 210 132 154 136 138 174 C 122 214 150 248 194 262 C 258 282 284 308 274 348 C 262 396 196 404 150 384 C 132 376 120 366 112 354" 
        stroke="#F8FAFC" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- V Glyph (Sharp Precision Blade in Electric Cyan Gradient) -->
  <path d="M 276 156 L 358 376 L 434 156" 
        stroke="url(#saviGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Precision Anchor Dot (Intersection of Design & Tech) -->
  <circle cx="218" cy="270" r="7" fill="#3EE0FF"/>
  <circle cx="358" cy="376" r="6" fill="#3EE0FF"/>
</svg>
