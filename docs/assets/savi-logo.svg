<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Liquid Champagne Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7C0"/>
      <stop offset="45%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9C7E55"/>
    </linearGradient>

    <!-- Warm Silk Titanium Gradient -->
    <linearGradient id="silkLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEAE3"/>
    </linearGradient>

    <!-- Radial Card Atmosphere -->
    <radialGradient id="badgeAtmosphere" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </radialGradient>
  </defs>

  <!-- Luxury Architectural Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="20" fill="url(#badgeAtmosphere)" stroke="rgba(197, 168, 128, 0.22)" stroke-width="1.5"/>
  <rect x="34" y="34" width="444" height="444" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- Architectural Datum Crosshairs (Horiz & Vert alignment) -->
  <line x1="24" y1="256" x2="488" y2="256" stroke="rgba(197, 168, 128, 0.08)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="256" y1="24" x2="256" y2="488" stroke="rgba(197, 168, 128, 0.08)" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- SV Duality Monogram Core -->
  <g transform="translate(68, 68)">
    <!-- 'S' Glyph (Sahera Banu: Fluid Design Intuition, Editorial Flow & Proportion) -->
    <!-- Double-stroke precision curves in Warm Silk -->
    <path d="M 216 68 C 172 62 96 74 76 116 C 56 160 102 188 152 208 C 224 234 262 268 252 320 C 240 376 166 388 94 364 C 68 354 50 340 42 324" 
          stroke="url(#silkLinear)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'V' Glyph (Vijay Prasad: Architectural Logic & Engineering Apex) -->
    <!-- Interlocks with S at the central golden ratio node in Champagne Gold -->
    <path d="M 226 76 L 298 334 L 358 76" 
          stroke="url(#goldLinear)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Precision Registration Marks (Italian / Swiss Horology aesthetic) -->
    <circle cx="298" cy="334" r="6" fill="#C5A880"/>
    <circle cx="152" cy="208" r="5" fill="#EDEAE3"/>
    
    <!-- Micro Datum Anchor -->
    <rect x="352" y="66" width="12" height="12" fill="none" stroke="#C5A880" stroke-width="2"/>
  </g>
</svg>
