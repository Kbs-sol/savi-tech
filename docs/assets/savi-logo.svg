<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" fill="none">
  <defs>
    <linearGradient id="underbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3EE0FF"/>
      <stop offset="100%" stop-color="#3EE0FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sa (white) -->
  <text x="4" y="38" font-family="'Outfit',system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-2.5" fill="#F4F7FB">Sa</text>
  <!-- Vi (cyan) with subtle glow -->
  <text x="68" y="38" font-family="'Outfit',system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-2.5" fill="#3EE0FF" filter="url(#glow)">Vi</text>
  <!-- Hairline underbar -->
  <rect x="4" y="44" width="140" height="2" rx="1" fill="url(#underbar)"/>
  <!-- TECH. subtext -->
  <text x="4" y="55" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="9" font-weight="500" letter-spacing="4" fill="#9AABC2">TECH.</text>
</svg>
