<svg class="savi-brand-svg" viewBox="0 0 340 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saviAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </linearGradient>
  </defs>

  <!-- Wordmark Core: Bespoke Geometric Glyphs & Visionary Duality -->
  <g class="savi-glyph-group">
    <!-- 'S': Fluid Swiss curve (Design Intuition & Proportion) -->
    <path class="glyph-s" d="M 12 40 C 12 43, 24 45, 34 45 C 48 45, 54 39, 54 32 C 54 22, 22 23, 22 13 C 22 7, 30 5, 42 5 C 50 5, 58 7, 62 10" 
          stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <!-- 'a': Geometric circle & stem ligature -->
    <path class="glyph-a" d="M 84 45 C 72 45, 66 35, 66 26 C 66 17, 73 8, 85 8 C 96 8, 102 16, 102 26 L 102 45 M 102 24 C 95 18, 75 18, 75 27 C 75 35, 87 35, 102 32" 
          stroke="#111111" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'V': Architectural Precision Vertex (The Impeller / Savitṛ) -->
    <path class="glyph-v" d="M 116 8 L 138 45 L 162 8" 
          stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- The Continuous Kinetic Horizon / Handover Loop -->
    <path class="glyph-impeller" d="M 102 42 C 114 42, 126 30, 138 45 C 150 30, 164 42, 184 42" 
          stroke="url(#saviAmberGrad)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

    <!-- 'i': Structured Stem with Living Solar Tittle -->
    <line class="glyph-i-stem" x1="184" y1="18" x2="184" y2="45" stroke="#111111" stroke-width="6.5" stroke-linecap="round"/>
    <circle class="glyph-i-tittle" cx="184" cy="7" r="4.5" fill="url(#saviAmberGrad)"/>
  </g>

  <!-- Structural Studio Partition -->
  <line x1="208" y1="12" x2="208" y2="48" stroke="#E6E4DF" stroke-width="1.5"/>

  <!-- Studio Identity Lockup -->
  <g class="savi-subtext" transform="translate(222, 18)">
    <text x="0" y="11" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" letter-spacing="2.2" fill="#E8590C">DESIGN. DEVELOP. DELIVER.</text>
    <text x="0" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" fill="#7E7E7E">Boutique Digital Studio</text>
  </g>
</svg>
