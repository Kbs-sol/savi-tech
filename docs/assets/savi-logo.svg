<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Solid deep background -->
  <rect width="512" height="512" rx="24" fill="#0C0D10"/>
  
  <!-- Subtle architectural border -->
  <rect x="20" y="20" width="472" height="472" rx="16" fill="none" stroke="#262830" stroke-width="2"/>

  <!-- Grid Guide Lines (Precision & Craft) -->
  <line x1="20" y1="256" x2="492" y2="256" stroke="#1A1C23" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="256" y1="20" x2="256" y2="492" stroke="#1A1C23" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g transform="translate(64, 64)">
    <!-- 'S' Monogram: Architectural, confident geometry (Warm Alabaster #F5F2EB) -->
    <path d="M 190 60 L 96 60 C 60 60 48 84 48 116 C 48 172 192 168 192 236 C 192 284 164 300 120 300 L 24 300" 
          stroke="#F5F2EB" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

    <!-- 'V' Monogram: Direct, deliberate downward convergence (Burnt Safety Signal #FF542E) -->
    <!-- Interlocks with S at the mathematical golden ratio -->
    <path d="M 196 60 L 268 300 L 340 60" 
          stroke="#FF542E" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

    <!-- Precision Registration Crosshairs & Datum Mark -->
    <circle cx="268" cy="300" r="5" fill="#FF542E"/>
    <rect x="348" y="52" width="16" height="16" fill="#F5F2EB"/>
  </g>
</svg>
