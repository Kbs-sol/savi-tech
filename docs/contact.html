<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — SaVi Tech</title>
  <meta name="description" content="Start a project with SaVi Technologies. Website design, development, landing pages, and digital products.">
  <meta name="theme-color" content="#07111F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@360;480;560;640&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">SaVi <span>Tech</span></a>
      <nav class="nav" id="nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="about.html" data-nav="about">About</a>
        <a href="services.html" data-nav="services">Services</a>
        <a href="team.html" data-nav="team">Team</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <a class="btn btn-cyan header-cta" href="contact.html">Start a project</a>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow">Contact</p>
        <h1 id="contact-title">Tell us what you need.</h1>
      </div>
    </section>
    <section class="section" style="padding-top:20px">
      <div class="wrap split">
        <div>
          <p class="lede" id="contact-intro">A short note is enough. We reply with a straight answer about fit, timing, and next steps.</p>
          <dl class="meta-list" id="contact-meta"></dl>
        </div>
        <form class="contact-form" id="contact-form" novalidate>
          <label class="field">Name
            <input type="text" name="name" required autocomplete="name" placeholder="Your name">
          </label>
          <label class="field">Email
            <input type="email" name="email" required autocomplete="email" placeholder="you@company.com">
          </label>
          <label class="field">What are you looking for?
            <select name="interest" id="interest-select">
              <option>Website design</option>
              <option>Web development</option>
              <option>Landing pages</option>
              <option>UI / UX</option>
              <option>App development</option>
              <option>Digital solutions</option>
              <option>Something else</option>
            </select>
          </label>
          <label class="field">Message
            <textarea name="message" required placeholder="A few lines about the project."></textarea>
          </label>
          <button class="btn btn-cyan" type="submit">Send message</button>
          <p class="form-note" id="form-note" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-brand">SaVi</p>
        <p class="footer-tag" id="footer-tag">Design. Develop. Deliver.</p>
      </div>
      <p class="footer-legal">© <span id="year"></span> <span id="footer-legal-name">SaVi Technologies</span></p>
      <nav class="footer-links" aria-label="Footer">
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </footer>
  <script src="site.js"></script>
</body>
</html>
